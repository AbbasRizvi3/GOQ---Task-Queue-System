name: Go

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main", "dev"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.25.4"

      - name: Build
        run: go build -v ./...
        working-directory: ./GOQ---Task-Queue-System

      - name: Test
        run: go test -v ./...
        working-directory: ./GOQ---Task-Queue-System
