{{define "dashboard.html"}}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - GOQ</title>
    
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.3/dist/cdn.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #f3f4f6; color: #1f2937; min-height: 100vh; }
        .navbar { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 50; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        .navbar h1 { font-size: 1.25rem; font-weight: 800; }
        .nav-link { color: rgba(255,255,255,0.9); text-decoration: none; font-weight: 500; padding: 0.5rem 1rem; border-radius: 0.5rem; transition: 0.2s; }
        .nav-link:hover { background: rgba(255,255,255,0.2); }
        .container { max-width: 1200px; margin: 2rem auto; padding: 0 1.5rem; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 1.5rem; margin-bottom: 2rem; }
        .stat-card { background: white; padding: 1.5rem; border-radius: 1rem; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); border: 1px solid #e5e7eb; }
        .stat-label { font-size: 0.875rem; color: #6b7280; font-weight: 500; margin-bottom: 0.5rem; }
        .stat-value { font-size: 2rem; font-weight: 800; color: #111827; }
        .task-list { background: white; border-radius: 1rem; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); overflow: hidden; border: 1px solid #e5e7eb; }
        .task-item { padding: 1.25rem; border-bottom: 1px solid #f3f4f6; display: flex; justify-content: space-between; align-items: center; cursor: pointer; transition: background 0.1s; }
        .task-item:hover { background: #f9fafb; }
        .task-title { font-weight: 600; color: #111827; }
        .detail-view { background: white; border-radius: 1rem; padding: 2rem; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
        .back-btn { display: inline-flex; align-items: center; gap: 0.5rem; color: #6b7280; cursor: pointer; margin-bottom: 1.5rem; font-weight: 600; }
        .back-btn:hover { color: #111827; }
        .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 2rem; margin-top: 2rem; }
        .info-label { font-size: 0.75rem; color: #6b7280; font-weight: 600; text-transform: uppercase; margin-bottom: 0.25rem; }
        .info-val { font-size: 1rem; font-weight: 500; }
        .error-console { background: #1e1e1e; color: #f87171; font-family: monospace; padding: 1rem; border-radius: 0.5rem; margin-top: 0.5rem; overflow-x: auto; font-size: 0.85rem; border: 1px solid #991b1b; }
        .payload-box { background: #f8fafc; padding: 1rem; border-radius: 0.5rem; font-family: monospace; font-size: 0.85rem; margin-top: 0.5rem; overflow-x: auto; border: 1px solid #e2e8f0; }
        .badge { padding: 0.25rem 0.75rem; border-radius: 9999px; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; }
        .status-pending { background: #fff7ed; color: #c2410c; } .status-leased { background: #f0f9ff; color: #0284c7; }
        .status-completed { background: #ecfdf5; color: #047857; } .status-failed { background: #fef2f2; color: #b91c1c; }
        .status-retry { background: #fefce8; color: #a16207; } .status-canceled { background: #f3f4f6; color: #4b5563; }
        .btn { padding: 0.5rem 1rem; border-radius: 0.5rem; font-weight: 600; font-size: 0.875rem; cursor: pointer; border: 1px solid transparent; transition: 0.2s; }
        .btn-primary { background: #111827; color: white; }
        .btn-view { background: #f3f4f6; color: #374151; }
        .btn-view:hover { background: #e5e7eb; }
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); backdrop-filter: blur(4px); z-index: 100; display: flex; align-items: center; justify-content: center; }
        .modal-card { background: white; width: 90%; max-width: 500px; padding: 2rem; border-radius: 1.5rem; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25); }
        .input-field { width: 100%; padding: 0.75rem; border: 2px solid #e5e7eb; border-radius: 0.75rem; margin-bottom: 1rem; }
        .toast { position: fixed; bottom: 2rem; right: 2rem; padding: 1rem 1.5rem; background: #10b981; color: white; border-radius: 1rem; font-weight: 600; z-index: 200; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); }
        .toast.error { background: #ef4444; }
    </style>
</head>
<body>

    <div x-data="app()" x-init="init()" class="app-wrapper">
        
        <nav class="navbar">
            <h1>GOQ Dashboard</h1>
            <a href="/logout" class="nav-link">Log Out</a>
        </nav>

        <div class="container">

            <div x-show="currentView === 'dashboard'" x-transition>
                <div style="display: flex; justify-content: space-between; margin-bottom: 1.5rem;">
                    <h2 style="font-size: 1.5rem; font-weight: 700;">Overview</h2>
                    <button @click="openModal()" class="btn btn-primary">+ New Task</button>
                </div>

                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-label">Total Tasks</div>
                        <div class="stat-value" x-text="stats.total">0</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">Pending</div>
                        <div class="stat-value" style="color: #c2410c;" x-text="stats.pending">0</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">Running</div>
                        <div class="stat-value" style="color: #0284c7;" x-text="stats.running">0</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">Completed</div>
                        <div class="stat-value" style="color: #047857;" x-text="stats.completed">0</div>
                    </div>
                </div>

                <div class="task-list">
                    <div x-show="isLoading" style="padding: 2rem; text-align: center; color: #6b7280;">Loading tasks...</div>
                    <div x-show="!isLoading && tasks.length === 0" style="padding: 2rem; text-align: center;">No tasks found.</div>

                    <template x-for="task in tasks" :key="task.ID || task.id">
                        <div class="task-item" @click="loadDetail(task.ID || task.id)">
                            <div>
                                <div class="task-title" x-text="task.Name || task.name"></div>
                                <div style="font-size: 0.85rem; color: #6b7280; margin-top: 0.25rem;">
                                    Run At: <span x-text="formatDate(task.RunAt || task.run_at)"></span>
                                </div>
                            </div>
                            <div style="display: flex; gap: 1rem; align-items: center;">
                                <span class="badge" :class="'status-' + (task.State || task.state)" x-text="task.State || task.state"></span>
                                <button class="btn btn-view">View</button>
                            </div>
                        </div>
                    </template>
                </div>
            </div>

            <div x-show="currentView === 'detail'" style="display: none;" x-transition>
                <div @click="goBack()" class="back-btn">
                    <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                    Back to Dashboard
                </div>

                <div x-show="!selectedTask" style="text-align: center; padding: 4rem;">Loading details...</div>

                <div class="detail-view" x-show="selectedTask">
                    <div style="display: flex; justify-content: space-between; align-items: start; border-bottom: 1px solid #e5e7eb; padding-bottom: 1.5rem;">
                        <div>
                            <div style="font-size: 0.85rem; color: #6b7280; font-weight: 700; margin-bottom: 0.25rem;">
                                TASK ID: <span x-text="selectedTask?.ID || selectedTask?.id"></span>
                            </div>
                            <h1 style="font-size: 1.75rem; font-weight: 800;" x-text="selectedTask?.Name || selectedTask?.name"></h1>
                        </div>
                        <span class="badge" :class="'status-' + (selectedTask?.State || selectedTask?.state)" x-text="selectedTask?.State || selectedTask?.state" style="font-size: 1rem; padding: 0.5rem 1rem;"></span>
                    </div>

                    <div class="info-grid">
                        <div>
                            <div class="info-label">Created At</div>
                            <div class="info-val" x-text="formatDate(selectedTask?.CreatedAt || selectedTask?.created_at)"></div>
                        </div>
                        <div>
                            <div class="info-label">Scheduled Run</div>
                            <div class="info-val" x-text="formatDate(selectedTask?.RunAt || selectedTask?.run_at)"></div>
                        </div>
                        
                        <div>
                            <div class="info-label">Next Run At</div>
                            <div class="info-val" x-text="formatDate(selectedTask?.NextRunAt || selectedTask?.next_run_at)"></div>
                        </div>

                        <div>
                            <div class="info-label">Retries</div>
                            <div class="info-val">
                                <span x-text="getRetryCount(selectedTask)"></span> / 
                                <span x-text="getMaxRetries(selectedTask)"></span>
                            </div>
                        </div>
                    </div>

                    <div style="margin-top: 2rem;">
                        <div class="info-label">Payload</div>
                        <div class="payload-box" x-text="formatPayload(selectedTask?.Payload || selectedTask?.payload)"></div>
                    </div>

                    <div x-show="['failed', 'dead', 'retry'].includes(selectedTask?.State || selectedTask?.state)" style="margin-top: 2rem;">
                        <div class="info-label" style="color: #ef4444;">ERROR LOG</div>
                        <div class="error-console" x-text="selectedTask?.Error || selectedTask?.error || 'No error details provided by the worker.'"></div>
                    </div>

                    <div style="margin-top: 2rem; padding-top: 2rem; border-top: 1px solid #e5e7eb; display: flex; gap: 1rem;">
                        <button x-show="canRetry(selectedTask)" @click="performAction('retry')" class="btn" style="background: #fffbeb; color: #92400e; border: 1px solid #fcd34d;">Retry Task</button>
                        <button x-show="canCancel(selectedTask)" @click="performAction('cancel')" class="btn" style="background: #fef2f2; color: #991b1b; border: 1px solid #fecaca;">Cancel Task</button>
                    </div>
                </div>
            </div>
        </div>

        <div x-show="showModal" class="modal-overlay" style="display: none;" x-transition>
            <div class="modal-card" @click.away="showModal = false">
                <h2 style="font-size: 1.5rem; font-weight: 700; margin-bottom: 1.5rem;">Create New Task</h2>
                <form @submit.prevent="submitTask()">
                    <label style="display:block; font-weight:600; margin-bottom:0.5rem;">Task Name</label>
                    <input type="text" x-model="newTask.name" class="input-field" required minlength="8">
                    <label style="display:block; font-weight:600; margin-bottom:0.5rem;">Payload</label>
                    <input type="text" x-model="newTask.payload" class="input-field" placeholder='{"id": 1}'>
                    <label style="display:block; font-weight:600; margin-bottom:0.5rem;">Run At</label>
                    <input type="datetime-local" x-model="newTask.runAt" class="input-field" required>
                    <div style="display:flex; justify-content:flex-end; gap:1rem; margin-top:1rem;">
                        <button type="button" @click="showModal = false" class="btn" style="background:#f3f4f6;">Cancel</button>
                        <button type="submit" class="btn btn-primary">Create</button>
                    </div>
                </form>
            </div>
        </div>
        <div x-show="toast.show" class="toast" :class="{'error': toast.type === 'error'}" x-transition style="display: none;">
            <span x-text="toast.message"></span>
        </div>
    </div>

    <script>
        function app() {
            return {
                currentView: 'dashboard',
                tasks: [],
                selectedTask: null,
                isLoading: true,
                showModal: false,
                newTask: { name: '', payload: '', runAt: '' },
                toast: { show: false, message: '', type: 'success' },

                init() {
                    this.fetchTasks();
                    setInterval(() => {
                        if (this.currentView === 'dashboard') this.fetchTasks(true);
                        else if (this.currentView === 'detail' && this.selectedTask) this.fetchSingleTask(this.selectedTask.ID || this.selectedTask.id, true);
                    }, 1000);
                },

                async fetchTasks(silent = false) {
                    if (!silent) this.isLoading = true;
                    try {
                        const res = await fetch('/api/tasks');
                        if (res.status === 401) window.location.href = '/login';
                        const data = await res.json();
                        this.tasks = data.tasks || [];
                    } catch (e) { console.error(e); } 
                    finally { if (!silent) this.isLoading = false; }
                },

                async fetchSingleTask(id, silent = false) {
                    try {
                        const res = await fetch(`/api/tasks/${id}`);
                        const data = await res.json();
                        if (data.task) {
                            if (!silent) console.log("RAW TASK DATA:", data.task); 
                            this.selectedTask = JSON.parse(JSON.stringify(data.task));
                        }
                    } catch (e) { console.error(e); }
                },

                loadDetail(id) {
                    this.selectedTask = null;
                    this.currentView = 'detail';
                    this.fetchSingleTask(id);
                },

                goBack() {
                    this.currentView = 'dashboard';
                    this.selectedTask = null;
                    this.fetchTasks(true);
                },

                async performAction(action) {
                    if (!confirm(`Are you sure you want to ${action} this task?`)) return;
                    const id = this.selectedTask.ID || this.selectedTask.id;
                    try {
                        const res = await fetch(`/api/tasks/${id}/${action}`, { method: 'POST' });
                        if (res.ok) {
                            this.showToast(`Task ${action} successful`, 'success');
                            this.fetchSingleTask(id);
                        } else throw new Error();
                    } catch (e) { this.showToast(`Failed to ${action}`, 'error'); }
                },

                openModal() {
                    const now = new Date();
                    now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
                    this.newTask.runAt = now.toISOString().slice(0, 16);
                    this.newTask.name = ''; this.newTask.payload = '';
                    this.showModal = true;
                },

                async submitTask() {
                    try {
                        let pl = this.newTask.payload;
                        try { if(pl) pl = JSON.parse(pl); } catch(e){}
                        const res = await fetch('/api/tasks', {
                            method: 'POST',
                            headers: {'Content-Type': 'application/json'},
                            body: JSON.stringify({
                                name: this.newTask.name,
                                payload: pl,
                                run_at: new Date(this.newTask.runAt).toISOString()
                            })
                        });
                        if (res.ok) {
                            this.showToast("Task Created", "success");
                            this.showModal = false;
                            this.fetchTasks();
                        } else throw new Error();
                    } catch(e) { this.showToast("Failed to create", "error"); }
                },

                get stats() {
                    return {
                        total: this.tasks.length,
                        pending: this.tasks.filter(t => (t.State||t.state) === 'pending').length,
                        running: this.tasks.filter(t => (t.State||t.state) === 'leased').length,
                        completed: this.tasks.filter(t => (t.State||t.state) === 'completed').length
                    }
                },

                getRetryCount(t) { return (t.Retries !== undefined ? t.Retries : t.retries) || 0; },
                getMaxRetries(t) { return (t.MaxRetries !== undefined ? t.MaxRetries : t.max_retries) || 3; },
                canRetry(t) { 
                    if(!t) return false; 
                    const s = (t.State || t.state);
                    const r = this.getRetryCount(t);
                    const max = this.getMaxRetries(t);
                    return ['failed', 'dead', 'canceled', 'retry'].includes(s) && r < max; 
                },
                canCancel(t) { if(!t) return false; return ['pending', 'ready', 'leased', 'retry'].includes(t.State||t.state); },
                
                formatDate(d) { 
                    if (!d || d.startsWith('0001')) return 'Never'; 
                    return new Date(d).toLocaleString(); 
                },
                formatPayload(p) { return typeof p === 'object' ? JSON.stringify(p, null, 2) : (p || 'No Payload'); },
                showToast(msg, type) {
                    this.toast = { show: true, message: msg, type: type };
                    setTimeout(() => this.toast.show = false, 3000);
                }
            }
        }
    </script>
</body>
</html>
{{end}}
