{{define "login.html"}}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In - GOQ</title>
    
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.3/dist/cdn.min.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 400px;
            animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        
        .header { text-align: center; margin-bottom: 30px; }
        .logo-icon {
            width: 50px; height: 50px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 12px; display: flex; align-items: center; justify-content: center;
            margin: 0 auto 20px; color: white; font-size: 24px; font-weight: 800;
            box-shadow: 0 8px 15px rgba(118, 75, 162, 0.3);
        }
        h1 { color: #1a1a1a; font-size: 24px; font-weight: 700; margin-bottom: 5px; }
        p.subtitle { color: #666; font-size: 14px; }
        
        .input-group { margin-bottom: 20px; position: relative; }
        .input-field {
            width: 100%; padding: 16px; border: 2px solid #e5e5e5; border-radius: 12px;
            font-size: 15px; transition: all 0.2s; background: #f9f9f9;
        }
        .input-field:focus { outline: none; border-color: #667eea; background: white; box-shadow: 0 4px 12px rgba(102, 126, 234, 0.15); }
        .input-field.error { border-color: #ef4444; background: #fff5f5; }
        .input-field.success { border-color: #10b981; }
        
        .error-msg { color: #ef4444; font-size: 12px; margin-top: 6px; font-weight: 500; display: flex; align-items: center; gap: 4px; }
        
        button {
            width: 100%; padding: 16px; background: #1a1a1a; color: white; border: none;
            border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.2s;
        }
        button:hover { background: #333; transform: scale(1.01); }
        button:active { transform: scale(0.98); }
        button:disabled { opacity: 0.7; cursor: wait; }
        
        .alert { padding: 12px 16px; border-radius: 12px; margin-bottom: 25px; font-size: 13px; display: flex; align-items: center; gap: 10px; }
        .alert-error { background: #fef2f2; color: #991b1b; border: 1px solid #fee2e2; }
        .alert-success { background: #ecfdf5; color: #065f46; border: 1px solid #d1fae5; }
        
        .shake { animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both; }
        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }

        .footer-links { text-align: center; margin-top: 25px; font-size: 13px; color: #666; }
        .footer-links a { color: #667eea; text-decor        * { margin: 0; padding: 0; box-sizing: border-box; }
ation: none; font-weight: 700; }
    </style>
</head>
<body>

    <div class="login-card" 
         x-data="loginForm()" 
         :class="{ 'shake': shakeForm }">

        <div class="header">
            <div class="logo-icon">Q</div>
            <h1>Welcome Back</h1>
            <p class="subtitle">Enter your details to access your account</p>
        </div>
        
        {{if .Error}}
        <div class="alert alert-error">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
            <span>{{.Error}}</span>
        </div>
        {{end}}
        
        {{if .Success}}
        <div class="alert alert-success">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
            <span>{{.Success}}</span>
        </div>
        {{end}}
        
        <form method="POST" action="/login" @submit.prevent="submitForm($el)" novalidate>
            
            <div class="input-group">
                <input type="email" name="email" class="input-field" 
                       placeholder="Email Address"
                       x-model="formData.email"
                       @input="validateEmail()"
                       :class="{'error': errors.email, 'success': !errors.email && formData.email.length > 5}"
                       maxlength="100"
                       autocomplete="email">
                
                <div class="error-msg" x-show="errors.email" x-transition>
                    <span x-text="errors.email"></span>
                </div>
            </div>

            <div class="input-group">
                <input type="password" name="password" class="input-field" 
                       placeholder="Password"
                       x-model="formData.password"
                       @input="validatePassword()"
                       :class="{'error': errors.password}"
                       minlength="8"
                       maxlength="72"
                       autocomplete="current-password">
                
                <div class="error-msg" x-show="errors.password" x-transition>
                    <span x-text="errors.password"></span>
                </div>
            </div>

            <button type="submit" :disabled="isSubmitting">
                <span x-text="isSubmitting ? 'Logging in...' : 'Log In'"></span>
            </button>
        </form>

        <div class="footer-links">
            Don't have an account? <a href="/signup">Sign up</a>
        </div>
    </div>

    <script>
        function loginForm() {
            return {
                formData: {
                    email: '',
                    password: ''
                },
                errors: {},
                isSubmitting: false,
                shakeForm: false,

                validateEmail() {
                    const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                    if (!this.formData.email.trim()) {
                        this.errors.email = "Email is required";
                    } else if (!re.test(this.formData.email)) {
                        this.errors.email = "Invalid email address";
                    } else {
                        delete this.errors.email;
                    }
                },

                validatePassword() {
                    if (!this.formData.password) {
                        this.errors.password = "Password is required";
                    } else if (this.formData.password.length < 8) {
                        this.errors.password = "Password must be at least 8 characters";
                    } else {
                        delete this.errors.password;
                    }
                },

                submitForm(formElement) {
                    this.validateEmail();
                    this.validatePassword();

                    if (Object.keys(this.errors).length > 0) {
                        this.shakeForm = true;
                        setTimeout(() => this.shakeForm = false, 500);
                        return;
                    }

                    this.isSubmitting = true;
                    formElement.submit();
                }
            }
        }
    </script>
</body>
</html>
{{end}}
